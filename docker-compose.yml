version: '3.8'

services:
  # --- O Cérebro (Django) ---
  backend:
    build: ./backend
    container_name: bird_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - TAS_URL=http://tas:8001
      - ZIOS_URL=http://zios:8002

  # --- A Cara (React + Vite) ---
  frontend:
    build: ./frontend
    container_name: bird_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:8000/api

  # --- Inteligência Artificial (TAS) ---
  tas:
    build: ./tas
    container_name: bird_tas
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./tas:/app
    ports:
      - "8001:8001"

  # --- Sistema Operativo de Vida (ZIOS) ---
  zios:
    build: ./zios
    container_name: bird_zios
    volumes:
      - ./zios:/app
    ports:
      - "8002:8002"

  # --- Infraestrutura ---
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=bird_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:
