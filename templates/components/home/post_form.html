{% load static %}

<div class="bg-white dark:bg-gray-800 p-4 rounded-3xl shadow-sm mb-6 border border-gray-100 dark:border-gray-700">
    <form hx-post="{% url 'create_bird' %}" 
          hx-target="#feed-list" 
          hx-swap="afterbegin" 
          hx-encoding="multipart/form-data"
          enctype="multipart/form-data"
          id="create-bird-form">
        
        {% csrf_token %}
        
        <div class="flex gap-4">
            <div class="shrink-0 hidden sm:block">
                {% if request.user.profile.avatar %}
                    <img src="{{ request.user.profile.avatar.url }}" class="w-11 h-11 rounded-full object-cover shadow-sm">
                {% else %}
                    <div class="w-11 h-11 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500">
                        <i class="fas fa-user"></i>
                    </div>
                {% endif %}
            </div>

            <div class="flex-1">
                <textarea name="content" 
                          rows="2" 
                          class="w-full bg-transparent border-none p-2 text-lg text-gray-800 dark:text-white placeholder-gray-400 focus:ring-0 resize-none" 
                          placeholder="O que está a acontecer?"
                          required></textarea>

                <div id="media-preview-area" class="hidden mt-3 relative rounded-xl overflow-hidden bg-gray-100 dark:bg-black max-h-[400px] border border-gray-200 dark:border-gray-700">
                    <button type="button" onclick="clearPostMedia()" class="absolute top-2 right-2 z-10 bg-black/60 hover:bg-black/80 text-white w-8 h-8 rounded-full flex items-center justify-center transition backdrop-blur-sm">
                        <i class="fas fa-times"></i>
                    </button>
                    
                    <img id="img-preview" class="w-full h-full object-contain hidden">
                    <video id="video-preview" controls class="w-full h-full object-contain hidden"></video>
                </div>

                <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-100 dark:border-gray-700">
                    <div class="flex gap-3">
                        <label class="cursor-pointer text-indigo-500 hover:bg-indigo-50 p-2 rounded-full transition tooltip" data-tip="Foto">
                            <i class="far fa-image text-xl"></i>
                            <input type="file" name="image" accept="image/*" class="hidden" onchange="showPostPreview(this, 'image')">
                        </label>

                        <label class="cursor-pointer text-rose-500 hover:bg-rose-50 p-2 rounded-full transition tooltip" data-tip="Vídeo">
                            <i class="fas fa-video text-xl"></i>
                            <input type="file" name="video" accept="video/*" class="hidden" onchange="showPostPreview(this, 'video')">
                        </label>
                    </div>

                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-full font-bold shadow-md transition-transform active:scale-95 text-sm flex items-center gap-2">
                        <span>Publicar</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </form>

    <script>
        function showPostPreview(input, type) {
            const previewArea = document.getElementById('media-preview-area');
            const img = document.getElementById('img-preview');
            const vid = document.getElementById('video-preview');
            
            // Limpa seleção anterior do outro tipo
            if (type === 'image') document.querySelector('input[name="video"]').value = '';
            else document.querySelector('input[name="image"]').value = '';

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    previewArea.classList.remove('hidden');
                    if (type === 'image') {
                        img.src = e.target.result;
                        img.classList.remove('hidden');
                        vid.classList.add('hidden');
                    } else {
                        vid.src = e.target.result;
                        vid.classList.remove('hidden');
                        img.classList.add('hidden');
                    }
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearPostMedia() {
            document.getElementById('media-preview-area').classList.add('hidden');
            document.querySelector('input[name="image"]').value = '';
            document.querySelector('input[name="video"]').value = '';
            document.getElementById('img-preview').src = '';
            document.getElementById('video-preview').src = '';
        }

        // Limpar tudo após postar com sucesso (HTMX Event)
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            if(evt.detail.elt.id === 'create-bird-form' && evt.detail.successful) {
                evt.detail.elt.reset();
                clearPostMedia();
            }
        });
    </script>
</div>
